<template>
    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_x-small">
        <p class="slds-text-body_small slds-text-color_weak">
            Build the Job Parameters below; the JSON they're saved as is shown underneath.
        </p>
        <lightning-button variant="base" label={modeToggleLabel} icon-name="utility:edit" onclick={handleToggleMode}></lightning-button>
    </div>

    <template lwc:if={isBuilderMode}>
        <!-- Variables -->
        <div class="builder-panel">
            <h4 class="slds-text-title_bold slds-m-bottom_x-small">Variables</h4>
            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                Named values the query uses. Insert a variable into Query - Where from the field chooser's Variables group.
                Test value is used instead of Value when Test.isRunningTest() is true; leave it blank to use Value.
            </p>
            <template for:each={displayVariableRows} for:item="row">
                <div key={row.key} class="variable-row">
                    <div class="slds-grid slds-gutters_x-small slds-wrap slds-grid_vertical-align-end">
                        <div class="slds-col slds-size_1-of-2 slds-medium-size_2-of-12">
                            <lightning-input label="Name" value={row.name} data-key={row.key} max-length="40" onchange={handleVariableName}></lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-medium-size_3-of-12">
                            <lightning-combobox label="Type" value={row.type} options={typeOptions} data-key={row.key} field-level-help={row.typeHelp} onchange={handleVariableType}></lightning-combobox>
                        </div>

                        <!-- Value -->
                        <template lwc:if={row.isRelative}>
                            <div class="slds-col slds-size_1-of-4 slds-medium-size_1-of-12">
                                <lightning-input type="number" label="Value" value={row.valueAmount} step="1" data-key={row.key} data-part="value" data-sub="amount" onchange={handleVariableValue}></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-4 slds-medium-size_2-of-12">
                                <lightning-combobox label="Unit" value={row.valueUnit} options={row.units} data-key={row.key} data-part="value" data-sub="unit" onchange={handleVariableValue}></lightning-combobox>
                            </div>
                        </template>
                        <template lwc:else>
                            <div class="slds-col slds-size_1-of-2 slds-medium-size_3-of-12">
                                <template lwc:if={row.isBoolean}>
                                    <lightning-combobox label="Value" value={row.value} options={booleanOptions} data-key={row.key} data-part="value" onchange={handleVariableValue}></lightning-combobox>
                                </template>
                                <template lwc:elseif={row.isNumber}>
                                    <lightning-input type="number" label="Value" value={row.value} step="any" data-key={row.key} data-part="value" onchange={handleVariableValue}></lightning-input>
                                </template>
                                <template lwc:elseif={row.isDate}>
                                    <lightning-input type="date" label="Value" value={row.value} data-key={row.key} data-part="value" onchange={handleVariableValue}></lightning-input>
                                </template>
                                <template lwc:elseif={row.isDateTime}>
                                    <lightning-input type="datetime" label="Value" value={row.value} data-key={row.key} data-part="value" onchange={handleVariableValue}></lightning-input>
                                </template>
                                <template lwc:else>
                                    <lightning-input label="Value" value={row.value} placeholder={row.textPlaceholder} data-key={row.key} data-part="value" onchange={handleVariableValue}></lightning-input>
                                </template>
                            </div>
                        </template>

                        <!-- Test value -->
                        <template lwc:if={row.isRelative}>
                            <div class="slds-col slds-size_1-of-4 slds-medium-size_1-of-12">
                                <lightning-input type="number" label="Test value" value={row.testAmount} step="1" data-key={row.key} data-part="testValue" data-sub="amount" onchange={handleVariableValue}></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-4 slds-medium-size_2-of-12">
                                <lightning-combobox label="Unit" value={row.testUnit} options={row.units} data-key={row.key} data-part="testValue" data-sub="unit" onchange={handleVariableValue}></lightning-combobox>
                            </div>
                        </template>
                        <template lwc:else>
                            <div class="slds-col slds-size_1-of-2 slds-medium-size_3-of-12">
                                <template lwc:if={row.isBoolean}>
                                    <lightning-combobox label="Test value" value={row.testValue} options={booleanTestOptions} data-key={row.key} data-part="testValue" onchange={handleVariableValue}></lightning-combobox>
                                </template>
                                <template lwc:elseif={row.isNumber}>
                                    <lightning-input type="number" label="Test value" value={row.testValue} step="any" data-key={row.key} data-part="testValue" onchange={handleVariableValue}></lightning-input>
                                </template>
                                <template lwc:elseif={row.isDate}>
                                    <lightning-input type="date" label="Test value" value={row.testValue} data-key={row.key} data-part="testValue" onchange={handleVariableValue}></lightning-input>
                                </template>
                                <template lwc:elseif={row.isDateTime}>
                                    <lightning-input type="datetime" label="Test value" value={row.testValue} data-key={row.key} data-part="testValue" onchange={handleVariableValue}></lightning-input>
                                </template>
                                <template lwc:else>
                                    <lightning-input label="Test value" value={row.testValue} placeholder={row.textPlaceholder} data-key={row.key} data-part="testValue" onchange={handleVariableValue}></lightning-input>
                                </template>
                            </div>
                        </template>

                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-12 slds-p-bottom_xx-small">
                            <lightning-button-icon icon-name="utility:delete" alternative-text="Remove this variable" title="Remove this variable" data-key={row.key} onclick={handleRemoveVariable}></lightning-button-icon>
                        </div>
                    </div>
                    <template lwc:if={row.token}>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">Used as <code>{row.token}</code></p>
                    </template>
                </div>
            </template>
            <lightning-button label="Add variable" icon-name="utility:add" onclick={handleAddVariable} class="slds-m-top_x-small"></lightning-button>

            <template lwc:if={hasVariableProblems}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-top_small" role="alert">
                    <template for:each={variableProblems} for:item="problem">
                        <h2 key={problem}>{problem}</h2>
                    </template>
                </div>
            </template>
        </div>

        <!-- FieldShift field values -->
        <template lwc:if={showFieldValues}>
            <div class="builder-panel">
                <h4 class="slds-text-title_bold slds-m-bottom_x-small">Set field values</h4>
                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                    FieldShift sets these fields on every record the query returns, then saves the records. A value can
                    also use a variable or token, typed in as text.
                </p>
                <template lwc:if={fieldValuesIgnored}>
                    <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_small" role="alert">
                        <h2>Only the FieldShift function uses field values; this job ignores them. Remove them, or choose FieldShift.</h2>
                    </div>
                </template>
                <template lwc:if={noFieldsYet}>
                    <p class="slds-text-body_small slds-text-color_weak">Choose the object in Query - From first.</p>
                </template>
                <template for:each={displayFieldRows} for:item="row">
                    <div key={row.key} class="slds-grid slds-gutters_x-small slds-wrap slds-grid_vertical-align-end field-row">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_5-of-12">
                            <c-job-sequence-search-select
                                label="Field"
                                placeholder="Search fields"
                                options={updateableFieldOptions}
                                exclude-values={row.excludeFields}
                                selected-label={row.fieldLabel}
                                data-key={row.key}
                                onselect={handleFieldName}
                            ></c-job-sequence-search-select>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                            <template lwc:if={row.isCheckbox}>
                                <lightning-input type="checkbox" label="New value: checked" checked={row.checked} data-key={row.key} disabled={row.isBlank} onchange={handleFieldValue} class="slds-p-bottom_x-small"></lightning-input>
                            </template>
                            <template lwc:elseif={row.isDate}>
                                <lightning-input type="date" label="New value" value={row.value} data-key={row.key} disabled={row.isBlank} onchange={handleFieldValue}></lightning-input>
                            </template>
                            <template lwc:elseif={row.isDateTime}>
                                <lightning-input type="datetime" label="New value" value={row.value} data-key={row.key} disabled={row.isBlank} onchange={handleFieldValue}></lightning-input>
                            </template>
                            <template lwc:elseif={row.isNumber}>
                                <lightning-input type="number" label="New value" value={row.value} step="any" data-key={row.key} disabled={row.isBlank} onchange={handleFieldValue}></lightning-input>
                            </template>
                            <template lwc:elseif={row.isPicklist}>
                                <lightning-combobox label="New value" value={row.value} options={row.picklistOptions} data-key={row.key} disabled={row.isBlank} onchange={handleFieldValue}></lightning-combobox>
                            </template>
                            <template lwc:else>
                                <lightning-input label="New value" value={row.value} data-key={row.key} disabled={row.isBlank} onchange={handleFieldValue}></lightning-input>
                            </template>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-medium-size_2-of-12 slds-p-bottom_x-small">
                            <lightning-input type="checkbox" label="Set to blank" checked={row.isBlank} data-key={row.key} onchange={handleFieldBlank}></lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-12 slds-p-bottom_xx-small">
                            <lightning-button-icon icon-name="utility:delete" alternative-text="Remove this field" title="Remove this field" data-key={row.key} onclick={handleRemoveField}></lightning-button-icon>
                        </div>
                    </div>
                </template>
                <lightning-button label="Add field" icon-name="utility:add" onclick={handleAddField} disabled={noFieldsYet} class="slds-m-top_x-small"></lightning-button>
            </div>
        </template>

        <!-- Handler parameters -->
        <template lwc:if={showHandlerParameters}>
            <div class="builder-panel">
                <h4 class="slds-text-title_bold slds-m-bottom_x-small">Handler parameters</h4>
                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                    Name/value pairs for a custom handler, which reads them from paramStringsByStrings (names in lower case).
                    Values may use variables and tokens.
                </p>
                <template for:each={handlerRows} for:item="row">
                    <div key={row.key} class="slds-grid slds-gutters_x-small slds-wrap slds-grid_vertical-align-end field-row">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                            <lightning-input label="Name" value={row.name} data-key={row.key} data-part="name" onchange={handleHandlerParameter}></lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_7-of-12">
                            <lightning-input label="Value" value={row.value} data-key={row.key} data-part="value" onchange={handleHandlerParameter}></lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-12 slds-p-bottom_xx-small">
                            <lightning-button-icon icon-name="utility:delete" alternative-text="Remove this parameter" title="Remove this parameter" data-key={row.key} onclick={handleRemoveHandlerParameter}></lightning-button-icon>
                        </div>
                    </div>
                </template>
                <lightning-button label="Add handler parameter" icon-name="utility:add" onclick={handleAddHandlerParameter} class="slds-m-top_x-small"></lightning-button>
            </div>
        </template>

        <template lwc:if={hasGeneratedText}>
            <p class="slds-text-body_small slds-text-color_weak slds-m-top_small">Job Parameters JSON:</p>
            <pre class="code-block"><code>{generatedText}</code></pre>
        </template>
    </template>

    <template lwc:else>
        <template lwc:if={parseError}>
            <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
                <h2>{parseError}</h2>
            </div>
        </template>
        <lightning-textarea
            label="Job Parameters (JSON)"
            value={rawText}
            max-length="20000"
            field-level-help="The fieldValues, variables and handlerParameters the builder edits. See Job Sequencer Help."
            onchange={handleRawChange}
            class="raw-text"
        ></lightning-textarea>
    </template>
</template>
