                <h1 class="slds-text-heading_large slds-m-bottom_small">Job Sequencer Help</h1>
                <p class="slds-m-bottom_medium">This will guide you through how to use the job sequencer.</p>

                <!-- About This Guide (added for the fork) -->
                <section class="help-section" data-id="about">
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">About This Guide</h2>
                    <p class="slds-m-bottom_small">
                        This guide was originally written by Jason Hardy for the Job Sequencer. Gary Butler's fork
                        added the <strong>Job Parameters and Variables</strong>, <strong>Running Jobs on Demand</strong>,
                        <strong>Run History and Cleanup</strong> and <strong>Security Model</strong> sections, and updated
                        the rest for the <strong>Sequence Jobs</strong>, <strong>Job Sequencer Settings</strong> and
                        <strong>Job Sequence Scheduler</strong> tabs, sub-hourly frequencies, run tracking, the long text

                <section class="help-section" data-id="manage_job_sequencer_settings">
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">Managing Job Sequencer Settings</h2>
                    <p class="slds-m-bottom_small">
                        Open the <strong>Job Sequencer Settings</strong> tab to change the settings that are used
                        throughout the job sequencer. They are stored in the "Sequence Jobs Settings" custom setting,
                        which can also be found in the custom settings area of Setup. <a href="#" data-tab="Job_Sequencer_Settings" onclick={handleOpenTab}>Open Job Sequencer Settings</a>
                    </p>
                    <ol class="slds-list_ordered">
                        <li>
                            <strong>Max Retries</strong>: This setting controls how many times a batch job is retried
                            when it can't start. Retries are needed when there are too many batch jobs in process at one
                            time (Salesforce allows 5) for a new one to start. When the retries run out, an error is
                            logged and the run stops; the remaining jobs in the sequence don't run.
                        </li>
                        <li>
                            <strong>Minutes Until Retry</strong>: This setting controls how many minutes in the future
                            that a temporary job will be scheduled to retry the job that was not successful.
                        </li>
                        <li>
                            <strong>Enabled</strong>: Turning this off stops the job sequencer. Scheduled runs still
                            fire but don't start their sequence, and a sequence that is already running stops before its
                            next job. Turn it off to let a runaway sequence clear out while you fix the cause.
                        </li>
                        <li>
                            <strong>Run Timeout (minutes)</strong>: A run of a frequency is skipped while the previous
                            run of the same frequency is still going. After this many minutes, the previous run is
                            treated as stopped (Abandoned) and the next run starts. The default is 60.
                        </li>
                        <li>
                            <strong>Run History Days</strong> and <strong>Error History Days</strong>: how long the daily
                            cleanup jobs keep Job Sequence Runs and Job Sequence Errors. Both default to 30. See <a href="#run_history" data-target="run_history" onclick={handleJump}>Run History and Cleanup</a>.
                        </li>
                    </ol>
                </section>

                <section class="help-section" data-id="new_sequence_job">
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">Creating a New Sequence Job</h2>
                    <p class="slds-m-bottom_small">
                        To create a new job sequence, you'll need to create a new "Sequence Job" custom meta data record.
                        The easiest way is the <strong>Sequence Jobs</strong> tab: click <strong>New</strong>, fill in
                        the fields, use <strong>Test Query</strong> to check the query, and click <strong>Save</strong>.
                        In the Query section, choose the object from the list. When the cursor is in Query - Select,
                        Where or OrderBy, a field chooser appears under the box: pick a field to insert it at the cursor
                        (commas are added in Select and OrderBy). In Select it also lists related lists, which are added
                        as a subquery. Type parent fields such as RecordType.DeveloperName directly. Or click <strong>Paste a query</strong> and paste a working SOQL query (e.g. from Salesforce Inspector) to
                        fill in From, Select, Where, OrderBy and Record Limit at once. Test Query checks the query against
                        the current org.
                        Handler Class is a list of the classes that implement JobSequenceInterface, and Function Name
                        lists the functions the chosen handler offers. The <strong>Job Parameters</strong> builder sets
                        the query's variables (each with an optional value for when Test.isRunningTest() is true),
                        FieldShift's field values and a custom handler's parameters, without writing the JSON by hand;
                        <strong>Edit as text</strong> edits the JSON directly.
                        Saves run in the background and usually take 10 to 30 seconds. <a href="#" data-tab="Job_Sequence_Manager" onclick={handleOpenTab}>Open Sequence Jobs</a>
                    </p>
                    <p class="slds-m-bottom_small">You can also create the record in Setup:</p>
                    <ol class="slds-list_ordered">
                        <li>Go to <strong>Setup</strong></li>
                        <li>Use quick find and input <kbd><strong>Custom Metadata Types</strong></kbd></li>
                        <li>Click on the link for <strong>Custom Metadata Types</strong></li>
                        <li>
                            When the new page loads, click on <strong>Manage Records</strong> link next to <em>Sequence Job</em>
                        </li>
                        <li>Click on <strong>New</strong> button</li>
                    </ol>
                </section>

                <section class="help-section" data-id="modify_js">
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">Modifying existing Sequence Job's</h2>
                    <p class="slds-m-bottom_small">
                        To change a job sequence, you'll need to edit the "Sequence Job" custom meta data record. On the <strong>Sequence Jobs</strong> tab, use a row's menu to <strong>Edit</strong>, <strong>Clone</strong>, <strong>Activate</strong> or <strong>Deactivate</strong> it, or <strong>Move up</strong> or <strong>Move down</strong> to change its run order. Records can't be
                        deleted from the tab; deactivate them, or delete them in Setup with <strong>Open in Setup</strong>.
                    </p>
                    <p class="slds-m-bottom_small">You can also edit the record in Setup:</p>
                    <ol class="slds-list_ordered">
                        <li>Go to <strong>Setup</strong> area.</li>
                        <li>Use quick find and input <kbd><strong>Custom Metadata Types</strong></kbd></li>
                        <li>Click on the link for <strong>Custom Metadata Types</strong></li>
                        <li>
                            When the new page loads, click on <strong>Manage Records</strong> link next to <em>Sequence Job</em>
                        </li>
                        <li>Click on <strong>Edit</strong> link next to the job sequence you would like to adjust.</li>
                    </ol>
                </section>

                <section class="help-section" data-id="sequence_job_fields">
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">Sequence Job Fields</h2>
                    <ol class="slds-list_ordered">
                        <li>
                            <strong>Information</strong>
                            <ul class="slds-list_dotted">
                                <li>
                                    <strong>Sequence Job Name</strong>: The API Name of the job, it must be unique and
                                    may not have spaces or special characters besides underscores
                                </li>
                                <li><strong>Label</strong>: The Name of the job, it can contain any characters</li>
                                <li>
                                    <strong>Active</strong>: When this box is checked, the job sequence will run. If
                                    unchecked, it will be skipped
                                </li>
                                <li>
                                    <strong>Order</strong>: This is the order that the job will be run in. The
                                    recommendation is to use the frequency and the numeric order. For example, daily job
                                    number one would be D01
                                </li>
                                <li>
                                    <strong>Batch Job</strong>: When this box is checked, the job will be run in Batch
                                    Apex. If unchecked it will be run in Queueable Apex. The former is used where a query
                                    needs to be run and the results of the query processed. The latter is used for
                                    instances where a particular job is run and records to insert are returned (e.g.
                                    Campaign Member Auto Enrollment). If there is a custom function that needs to be run,
                                    it must be defined in the <strong>executeFunction</strong> method of the handler
                                    class.
                                </li>
                            </ul>
                        </li>
                        <li>
                            <strong>Job Details</strong>
                            <ul class="slds-list_dotted">
                                <li>
                                    <strong>Job Frequency</strong>: How frequent will this job be run. The choices are
                                    Every 5, 10, 15 or 30 Minutes, Hourly, Daily, Weekly, Monthly, Quarterly and Yearly,
                                    plus Test Only (for unit tests) and One Time.
                                </li>
                                <li>
                                    <strong>Job Type</strong>: What type of job is this? If DML is selected, the queried
                                    records simply have a DML statement executed against them.
                                </li>
                                <li class="help-anchor" data-id="sequence_job_fields_handler_class_field">
                                    <strong>Handler Class</strong>: This is the name of handler class that implements the <kbd>JobSequenceInterface</kbd> class. The <kbd>JobSequenceDefaultHandler</kbd> class
                                    is defined by default; however, if you <a href="#using_custom_handler" data-target="using_custom_handler" onclick={handleJump}>define a custom handler</a> its name can be put into this field.
                                </li>
                                <li>
                                    <strong>Job Notification Email</strong>: When the job logs errors, an email goes to
                                    the user who scheduled it. If a separate email address needs to be notified as well,
                                    input it here.
                                </li>
                                <li class="help-anchor" data-id="sequence_job_fields_dml_or_function_field">
                                    <strong>Job Execution DML Type or Function Name</strong>: The values you define here
                                    will depend on the job type you select.
                                    <ul class="slds-list_dotted">
                                        <li>
                                            <strong>DML</strong>: Input <strong>DELETE</strong> or <strong>UPDATE</strong> to process those DML statements against the queried
                                            records. The Sequence Job validation rules allow only these two, although the
                                            code underneath can also insert and upsert.
                                        </li>
                                        <li>
                                            <strong>Function</strong>: Input the name of the function that will be run
                                            during the sequence's execution. This function must be defined in the <kbd>executeFunction</kbd> method of the <a href="#using_custom_handler" data-target="using_custom_handler" onclick={handleJump}>handler</a> defined in the <a href="#sequence_job_fields_handler_class_field" data-target="sequence_job_fields_handler_class_field" onclick={handleJump}>Handler Class field</a> the sequence job.
                                        </li>
                                    </ul>
                                </li>
                            </ul>
                        </li>
                        <li>
                            <strong>Job Options</strong>
                            <ul class="slds-list_dotted">
                                <li>
                                    <strong>Job Batch Limit</strong>: This should be defined between 1 and 200, and it
                                    will control how many records are processed in each batch.
                                </li>
                                <li>
                                    <strong>Upsert External Id Field</strong>: If an upsert operation is being done (not
                                    currently supported, because the validation rules allow only UPDATE and DELETE for DML
                                    jobs), this would be the field that would be execute against to determine if the
                                    records in question should be inserted or updated.
                                </li>
                                <li>
                                    <strong>Permanent Delete</strong>: If this box is checked when the DELETE DML type
                                    is set, the records deleted will be removed from the recycle bin.
                                </li>
                                <li>
                                    <strong>All or None</strong>: If this box is checked, it will not allow for partial
                                    success. For example in a batch of 200 records, if one fails, the entire batch would
                                    fail if this box is checked.
                                </li>
                                <li>
                                    <strong>Job Parameters</strong>: The job's variables, the field values FieldShift
                                    sets and a custom handler's parameters, saved as JSON. Please see the "Job
                                    Parameters and Variables" and "Common Functions" areas for more information.
                                </li>
                            </ul>
                        </li>
                        <li>
                            <strong>Query</strong> Queries only need to be run for Batch Jobs. All of these fields are required (except the
                            order by and the record limit) when the <strong>Batch Job</strong> box is checked. <strong>Query - Select</strong>, <strong>Query - Where</strong> and <strong>Job Parameters</strong> are long text areas that hold up to 20,000 characters, so
                            they can contain complex queries. They can also use <strong>settings tokens</strong>: write <samp>{settingsTokenExample}</samp> and it is replaced with that field's value from the Sequence
                            Jobs Settings when the query is built, so a job can be tuned from Job Sequencer Settings instead
                            of being edited. An unknown field, or one without a value, stops the job with a Job Sequence
                            Error.
                            <ul class="slds-list_dotted">
                                <li>
                                    <strong>Query - Select</strong>: The fields that will be retrieved during the query.
                                    Use comma's to separate each of the fields.
                                </li>
                                <li>
                                    <strong>Query - From</strong>: The API Name of the object where the records will be
                                    retrieved from.
                                </li>
                                <li>
                                    <strong>Query - Where</strong>: The criteria that will be used to select the
                                    appropriate records.
                                </li>
                                <li>
                                    <strong>Query - OrderBy</strong>: The sorted order that the records will be returned
                                    in. This is important when processing batch jobs. If there are updates to similar
                                    records (e.g. account) and the results are not sorted to where like records are
                                    processed, then row lock errors may occur since Salesforce maybe attempting to update
                                    the same related record in two separate batch contexts. It's optional; without it the
                                    query has no ORDER BY clause. For example, if you have two
                                    batches running and contacts sharing the same account are in each batch and both try
                                    to update their respective accounts, then those updates to the contact records will
                                    fail due to the account record being locked for update.
                                </li>
                                <li>
                                    <strong>Query - Record Limit</strong>: Will limit how many records are returned with
                                    the query. This is useful when there are a large amount of records that need to be
                                    processed.
                                </li>
                            </ul>
                        </li>
                        <li><strong>System Information:</strong> Ignore this area</li>
                    </ol>
                </section>

                <section class="help-section" data-id="reviewing_errors">
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">Reviewing Errors</h2>
                    <p>
                        Errors that crop up during processing should be logged in the "Job Sequence Error" tab. You can
                        view the most recent by sorting the name. This will give you helpful data on what job failed and
                        (hopefully) why. Each error links to the Job Sequence Run it happened in, and the home page lists
                        the most recent errors. When a job logs errors, an email is sent to the user who scheduled it and
                        to the job's notification email, if one is set.
                    </p>
                </section>

                <section class="help-section" data-id="job_parameters">
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">Job Parameters and Variables</h2>
                    <p class="slds-m-bottom_small">
                        <strong>Job Parameters</strong> hold a job's variables, the field values FieldShift sets, and any
                        parameters a custom handler reads. They are saved as JSON in the Job Parameters field. On the
                        Sequence Jobs tab the Job Parameters builder writes it for you; <strong>Edit as text</strong>
                        shows the JSON.
                    </p>
                    <h3 class="slds-text-heading_small slds-m-bottom_small">Variables</h3>
                    <p class="slds-m-bottom_small">
                        A variable is a named, typed value the query uses as <samp>{tokens.variable}</samp>. When the job
                        runs, each token is replaced with a SOQL literal of the variable's type, so text is quoted and
                        escaped, lists become <samp>('A','B')</samp> and dates are formatted for SOQL. Insert a variable
                        into Query - Where from the field chooser's Variables group, which lists only the variables
                        you've defined. Renaming a variable in the builder renames its tokens in the Where too.
                    </p>
                    <table class="slds-table slds-table_bordered slds-table_col-bordered slds-table_fixed-layout slds-m-bottom_small" aria-label="Variable types">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col" class="slds-cell-wrap">Type</th>
                                <th scope="col" class="slds-cell-wrap">Value</th>
                                <th scope="col" class="slds-cell-wrap">Goes into the query as</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td class="slds-cell-wrap">Text</td><td class="slds-cell-wrap"><samp>Closed Lost</samp></td><td class="slds-cell-wrap"><samp>'Closed Lost'</samp>, quoted and escaped</td></tr>
                            <tr><td class="slds-cell-wrap">Number, Boolean</td><td class="slds-cell-wrap"><samp>5</samp>, <samp>true</samp></td><td class="slds-cell-wrap"><samp>5</samp>, <samp>true</samp></td></tr>
                            <tr><td class="slds-cell-wrap">Date, Date/time</td><td class="slds-cell-wrap">a date or date/time</td><td class="slds-cell-wrap"><samp>2026-10-17</samp>, <samp>2026-10-17T15:00:00Z</samp> (GMT)</td></tr>
                            <tr><td class="slds-cell-wrap">Relative date</td><td class="slds-cell-wrap"><samp>-90 days</samp> (days, weeks, months, years)</td><td class="slds-cell-wrap">that date, counted from the day the job runs (GMT)</td></tr>
                            <tr><td class="slds-cell-wrap">Relative date/time</td><td class="slds-cell-wrap"><samp>-2 hours</samp> (minutes up to years)</td><td class="slds-cell-wrap">that date/time, counted from when the job runs</td></tr>
                            <tr><td class="slds-cell-wrap">Text list</td><td class="slds-cell-wrap"><samp>A, B</samp></td><td class="slds-cell-wrap"><samp>('A','B')</samp>, for use with IN</td></tr>
                            <tr><td class="slds-cell-wrap">SOQL fragment</td><td class="slds-cell-wrap"><samp>AND IsActive = true</samp></td><td class="slds-cell-wrap">exactly as written; may be blank</td></tr>
                        </tbody>
                    </table>
                    <h3 class="slds-text-heading_small slds-m-bottom_small">Values for Apex tests</h3>
                    <p class="slds-m-bottom_small">
                        Each variable has a <strong>Value</strong>, used by scheduled runs, and an optional
                        <strong>Test value</strong>, used instead when Test.isRunningTest() is true. A blank Test value
                        means the Value is used in tests too. This lets a test class find the test data it creates,
                        for example by including records changed today that scheduled runs skip. A Test Only job only
                        needs Test values; any other job needs a Value for every variable except SOQL fragments.
                    </p>
                    <p class="slds-m-bottom_small">For example, these variables:</p>
                    <pre class="code-block"><code>{parametersExample}</code></pre>
                    <p class="slds-m-bottom_small">with this Query - Where:</p>
                    <pre class="code-block"><code>{whereExample}</code></pre>
                    <p class="slds-m-bottom_small">run on 10/17/2026 as:</p>
                    <pre class="code-block"><code>{resolvedExample}</code></pre>
                    <p class="slds-m-bottom_small">and, when Test.isRunningTest() is true, as:</p>
                    <pre class="code-block"><code>{resolvedTestExample}</code></pre>
                    <h3 class="slds-text-heading_small slds-m-bottom_small">Other tokens</h3>
                    <ul class="slds-list_dotted slds-m-bottom_small">
                        <li><samp>{tokens.settings}</samp>: a field from Job Sequencer Settings, inserted as written.</li>
                        <li><samp>{tokens.label}</samp>: a custom label, inserted as written; put quotes around it for text.</li>
                        <li><samp>{tokens.mdt}</samp>: a field of a custom metadata record, inserted as written.</li>
                        <li><samp>{tokens.now}</samp> and <samp>{tokens.today}</samp>: when the job runs (GMT).</li>
                        <li><samp>{tokens.userId}</samp>: the Id of the user who scheduled the job, quoted in queries.</li>
                    </ul>
                    <p class="slds-m-bottom_small">
                        Tokens also work in field values and handler parameters, where they are inserted as plain values
                        without quotes. Test Query and the Built query panel show the query as written and with every
                        token filled in, and list anything that would stop the job running: an undefined variable, a
                        value that doesn't fit its type, or a missing Value.
                    </p>
                    <h3 class="slds-text-heading_small slds-m-bottom_small">Handler parameters</h3>
                    <p class="slds-m-bottom_small">
                        A custom handler can read its own name/value parameters from <samp>js.paramStringsByStrings</samp>,
                        with the names in lower case:
                    </p>
                    <pre class="code-block"><code>{handlerExample}</code></pre>
                </section>

                <section class="help-section" data-id="common_functions">
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">Common Functions in the Default Handler</h2>
                    <p class="slds-m-bottom_small">
                        This Section will describe how to use common job sequence functions in the default handler
                    </p>
                    <table class="slds-table slds-table_bordered slds-table_col-bordered slds-table_fixed-layout" aria-label="Default handler functions">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col" class="slds-cell-wrap">Function Name</th>
                                <th scope="col" class="slds-cell-wrap">Function Description</th>
                                <th scope="col" class="slds-cell-wrap">Function Parameters</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="slds-align-top">
                                <th scope="row" class="slds-cell-wrap"><strong><samp>fieldShift</samp></strong></th>
                                <td class="slds-cell-wrap">
                                    <p class="slds-m-bottom_small">
                                        This function will use the parameters defined to "shift" the value the fields
                                        defined as parameter's.
                                    </p>
                                    <p class="slds-m-bottom_small">
                                        For example, if you wanted to close opportunities you could define the StageName
                                        field and the "Closed Lost" status.
                                    </p>
                                    <p class="slds-m-bottom_small">Set StageName to Closed Lost.</p>
                                </td>
                                <td class="slds-cell-wrap">
                                    <p class="slds-m-bottom_small">
                                        On the Sequence Jobs tab, the Job Parameters builder's <strong>Set field values</strong> rows write this for you, with an input that matches each field's type.
                                    </p>
                                    <p class="slds-m-bottom_small">They are saved in the Job Parameters JSON as fieldValues:</p>
                                    <pre class="code-block"><code>{fieldShiftExample}</code></pre>
                                    <p class="slds-m-bottom_small">
                                        Field names aren't case sensitive. Values are converted to the field's type:
                                        numbers as 100 or 12.5, checkboxes as true or false, dates as 2026-12-31, and
                                        date/times as 2026-12-31T23:00:00.000Z. <samp>"blank": true</samp> clears a field,
                                        and a value may use a variable or token, such as <samp>{tokens.today}</samp>.
                                    </p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </section>

                <section class="help-section" data-id="using_custom_handler">
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">Using a Custom Handler</h2>
                    <p class="slds-m-bottom_small">
                        If you do not wish to use the standard handler for functions and DML operations, the system
                        provides an interface that you are able to implement. By implementing this interface, you will be
                        able to write and reference your own custom functions and DML operations. When you define a <a href="#new_sequence_job" data-target="new_sequence_job" onclick={handleJump}>sequence job</a>,
                        you can input the class name of your handler that extends the job sequence interface into the <a href="#sequence_job_fields_handler_class_field" data-target="sequence_job_fields_handler_class_field" onclick={handleJump}>Handler Class field</a>.
                        Doing this will tell the job sequencing where to look for the function or DML code that will be
                        executed with that job. The methods you will be implementing are outlined below.
                    </p>
                    <ul class="slds-list_dotted">
                        <li>
                            <strong><kbd>executeFunction</kbd></strong>: This method is where the job sequencer looks to
                            execute functions that are defined in a <a href="#new_sequence_job" data-target="new_sequence_job" onclick={handleJump}>sequence job</a> based on what is defined in the <a href="#sequence_job_fields_dml_or_function_field" data-target="sequence_job_fields_dml_or_function_field" onclick={handleJump}>Job Execution DML Type or Function Name</a> field.
                        </li>
                        <li>
                            <strong><kbd>executeDML</kbd></strong>: This method is where you can defined custom DML
                            execution code. If you do not wish to implement custom DML logic, then you may use the default
                            DML handling code defined in the utilities class:
                            <pre class="code-block"><code>JobSequenceUtilities.attemptJobSequenceDML(scope,js.executionJob,js.upsertField,js.allOrNone,js.permDelete);</code></pre>
                        </li>
                        <li>
                            <strong>Optional, <kbd>JobSequenceFunctionCatalog</kbd></strong>: also implement this interface
                            and return your function names from <kbd>getFunctionNames()</kbd> to have them listed in the
                            Function Name dropdown on the Sequence Jobs tab. Without it, the function name is typed in.
                        </li>
                        <li>
                            <strong><kbd>finishJobSequence</kbd></strong>: This method will be initiated once the current
                            execution cycle has finished. If it's a batch job, then this function will be executed at the
                            end of <strong>every</strong> batch. This method is useful if you wish to do a notification or
                            custom error handling.
                        </li>
                    </ul>
                </section>

                <section class="help-section" data-id="scheduling_jobs">
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">Scheduling Jobs</h2>
                    <p class="slds-m-bottom_small">
                        Use the <strong>Job Sequence Scheduler</strong> tab to set up the repeating schedule for each
                        frequency, from every 5 minutes to yearly. It shows whether each frequency is scheduled and when
                        it runs next, and lets you schedule, unschedule or run a frequency now. <a href="#" data-tab="Job_Sequence_Scheduler" onclick={handleOpenTab}>Open Job Sequence Scheduler</a>
                    </p>
                    <ul class="slds-list_dotted slds-m-bottom_small">
                        <li>
                            <strong>Sub-hourly frequencies</strong>: a Salesforce schedule can name only one minute in the
                            hour, so Every 15 Minutes is four scheduled jobs (at :00, :15, :30 and :45), Every 5 Minutes
                            is twelve, and so on. The Scheduler creates and removes them together. An org can have at
                            most 100 scheduled Apex jobs in total.
                        </li>
                        <li>
                            <strong>Skip if still running</strong>: each run is recorded as a Job Sequence Run. A run is
                            skipped while the previous run of the same frequency is still going (the running run's
                            Times Skipped counts it), unless that run is older than the Run Timeout setting. The home page shows recent
                            runs; run history is kept for 30 days.
                        </li>
                        <li>Jobs run as the user who scheduled them.</li>
                    </ul>
                    <p class="slds-m-bottom_small">
                        Alternatively, run one of these anonymously. Each schedules its frequency exactly as the
                        Scheduler's Schedule button does, and does nothing when it is already scheduled:
                    </p>
                    <pre class="code-block"><code><span class="code-line">JobSequenceUtilities.scheduleHourlyRun();</span><span class="code-line">JobSequenceUtilities.scheduleDailyRun();</span><span class="code-line">JobSequenceUtilities.scheduleWeeklyRun();</span><span class="code-line">JobSequenceUtilities.scheduleMonthlyRun();</span><span class="code-line">JobSequenceUtilities.scheduleQuarterlyRun();</span><span class="code-line">JobSequenceUtilities.scheduleYearlyRun();</span></code></pre>
                    <p class="slds-m-bottom_small">To schedule all six of these frequencies at once:</p>
                    <pre class="code-block"><code>JobSequenceUtilities.scheduleAllRuns();</code></pre>
                </section>

                <section class="help-section" data-id="running_on_demand">
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">Running Jobs on Demand</h2>
                    <p class="slds-m-bottom_small">
                        One Time jobs are never scheduled; they run when you start them. Any other frequency can also be
                        started outside its schedule. A run started this way changes records exactly as a scheduled run
                        would, and Test.isRunningTest() is false, so variables use their Value, not their Test value.
                        Test Only jobs only ever run inside Apex tests.
                    </p>
                    <h3 class="slds-text-heading_small slds-m-bottom_small">A whole frequency</h3>
                    <p class="slds-m-bottom_small">
                        On the <strong>Job Sequence Scheduler</strong> tab, click <strong>Run Now</strong> on the
                        frequency's row; One Time has its own row for this. <strong>Every active job</strong> in the
                        frequency runs, in order, as a tracked Job Sequence Run, and the run is refused while the
                        previous run of that frequency is still going. To start a frequency anonymously instead, use the
                        original starter, which also runs every active job in the frequency but isn't tracked as a run:
                    </p>
                    <pre class="code-block"><code>System.enqueueJob(new JobSequenceQueueable('One Time'));</code></pre>
                    <h3 class="slds-text-heading_small slds-m-bottom_small">One job on its own</h3>
                    <p class="slds-m-bottom_small">
                        To run a single One Time job without the others, open the <strong>Sequence Jobs</strong> tab and
                        choose <strong>Run standalone</strong> from the job's action menu. Only that job runs, and the
                        run ends when it finishes; other One Time jobs don't run, even if they are active. The job must
                        be active, and the run is tracked like any other and refused while a One Time run is still going.
                        <a href="#" data-tab="Job_Sequence_Manager" onclick={handleOpenTab}>Open Sequence Jobs</a>
                    </p>
                    <p class="slds-m-bottom_small">
                        To do the same anonymously, name the job after its frequency. This works for an active job of
                        any frequency except Test Only, and isn't tracked as a run:
                    </p>
                    <pre class="code-block"><code>System.enqueueJob(new JobSequenceQueueable('One Time', 'MY_JOB'));</code></pre>
                </section>

                <!-- Run History and Cleanup (added for the fork) -->
                <section class="help-section" data-id="run_history">
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">Run History and Cleanup</h2>
                    <p class="slds-m-bottom_small">
                        Every run started from the Job Sequence Scheduler is recorded as a <strong>Job Sequence Run</strong>,
                        with one <strong>Job Sequence Run Step</strong> per sequence job. They record:
                    </p>
                    <ul class="slds-list_dotted slds-m-bottom_small">
                        <li>start and finish times and the duration, for the run and for each job;</li>
                        <li>jobs run, records processed, records that failed to save, and errors logged (each Job Sequence
                            Error links to its run);</li>
                        <li><strong>Times Skipped</strong>: scheduled runs that didn't start because this run was still
                            going. A high number means the frequency is set more often than its jobs can finish.</li>
                    </ul>
                    <p class="slds-m-bottom_small">
                        The home page summarizes them, and the <strong>Job Sequence Runs with Steps</strong> report type
                        lets you build your own reports and dashboards.
                    </p>
                    <p class="slds-m-bottom_small">
                        The package includes two Daily sequence jobs that clean up after the sequencer, using settings
                        tokens for how long to keep records:
                    </p>
                    <ul class="slds-list_dotted">
                        <li><strong>JOBSEQ_PURGE_RUNS</strong> deletes finished Job Sequence Runs (and their steps) older
                            than Run History Days.</li>
                        <li><strong>JOBSEQ_PURGE_ERRORS</strong> deletes Job Sequence Errors older than Error History
                            Days.</li>
                        <li>They only run when the Daily frequency is scheduled; the home page warns when it isn't. You can
                            deactivate them on the Sequence Jobs tab.</li>
                    </ul>
                </section>

                <!-- Security Model (added for the fork) -->
                <section class="help-section" data-id="security_model">
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">Security Model</h2>
                    <p class="slds-m-bottom_small">
                        Sequence jobs run in <strong>system mode</strong>. Their queries and DML ignore the running
                        user's object permissions and field-level security, and the framework classes are <kbd>without sharing</kbd>, so record sharing does not limit them either.
                    </p>
                    <ul class="slds-list_dotted">
                        <li>
                            <strong>Anyone who can edit Sequence Job records can change or delete any data.</strong> Editing custom metadata needs the Customize Application permission, so control who has it.
                        </li>
                        <li>
                            <strong>Jobs run as the user who scheduled them.</strong> If that user is deactivated, the
                            scheduled runs stop. Consider scheduling from a dedicated user.
                        </li>
                        <li>
                            <strong>Triggers, flows, validation rules and duplicate rules still run</strong> on the
                            records a job changes, and can still make a job fail.
                        </li>
                        <li>
                            <strong>Saving from the Sequence Jobs tab</strong> uses an Apex metadata deployment, which
                            needs the same Customize Application permission as Setup. In an org that installed the
                            package, if a save fails to start, enable Setup &gt; Apex Settings &gt; "Deploy Metadata from
                            Non-Certified Package Versions via Apex".
                        </li>
                    </ul>
                </section>

                <section class="help-section" data-id="pro_tips">
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">Pro Tips</h2>
                    <ul class="slds-list_dotted">
                        <li>
                            A job can use as many variables as it needs, of any mix of types. Give each a name that says
                            what it is, such as cutoff or openStages; names start with a letter and use only letters,
                            numbers and underscores.
                        </li>
                        <li>
                            Use a Text list variable with IN instead of writing the quotes and parentheses yourself, and a
                            SOQL fragment with only a Test value to add a condition that applies only in Apex tests.
                        </li>
                        <li>
                            If you need something to run outside of a batch context be sure to uncheck the <strong>Batch Job</strong> box on the job sequence record!
                        </li>
                    </ul>
                </section>
